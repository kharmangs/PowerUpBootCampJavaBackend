server:
  port: 8001
  error:
    include-message: always
spring:
  application:
    name: "AuthenticatorApp"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    users: "/api/v1/users"

adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: pragma
    schema: authenticator
    username: db_user
    password: db_pass
